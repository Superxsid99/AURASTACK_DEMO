apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smart-case-buddy-api
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/smart-case-buddy/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: API_PORT
              value: "8000"
            - name: API_HOST
              value: "0.0.0.0"
            - name: REDIS_URL
              value: "redis://REDIS_HOST:6379"
            - name: AGENTS_SERVICE_URL
              value: "https://smart-case-buddy-agents-URL"
            - name: AUTH_REQUIRED
              value: "true"
            - name: INTAKE_QUEUE_ENABLED
              value: "true"
            - name: INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-worker-token
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-jwt-secret
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-database-url
                  key: latest
