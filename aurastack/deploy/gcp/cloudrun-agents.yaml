apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smart-case-buddy-agents
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/smart-case-buddy/agents:latest
          ports:
            - containerPort: 8001
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
